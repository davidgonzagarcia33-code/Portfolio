<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com https://fonts.cdnfonts.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://fonts.cdnfonts.com data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), interest-cohort=()">
    <title>Foam Gum — David González</title>
    <meta name="description" content="Proyecto Foam Gum: dirección creativa y diseño gráfico por David González. Concepto visual, cartelería y contenido.">
    <meta property="og:title" content="Foam Gum — David González">
    <meta property="og:description" content="Dirección creativa y diseño gráfico para Foam Gum.">
    <meta property="og:type" content="website">
    <link rel="icon" href="perfil.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        a, button { -webkit-tap-highlight-color: transparent; }
        body {
            background: #1a0a2e;
            font-family: 'Outfit', sans-serif;
            color: #fff;
            min-height: 100vh;
        }

        .nav {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(26,10,46,0.8);
            backdrop-filter: blur(10px);
        }
        .nav-logo {
            display: flex; align-items: center; gap: 0; text-decoration: none;
        }
        .nav-logo-box {
            display: flex; align-items: center; justify-content: center;
        }
        .nav-logo-box img { width: 50px; height: auto; border-radius: 50%; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a {
            color: #fff; text-decoration: none; font-size: 13px;
            font-weight: 500; letter-spacing: 2px; text-transform: uppercase;
            transition: opacity 0.3s ease;
        }
        .nav-links a:hover { opacity: 0.6; }
        .music-toggle { font-size: 10px; color: rgba(255,255,255,0.4); cursor: pointer; letter-spacing: -2px; transition: color 0.2s ease; user-select: none; background: none; border: none; padding: 0; font-family: inherit; }
        .music-toggle:hover { color: #EEFF00; }

        /* ── Zoom Tunnel ── */
        .zoom-tunnel {
            height: 350vh;
            position: relative;
        }
        .zoom-viewport {
            position: sticky;
            top: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1a0a2e;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .zoom-bg-pattern {
            position: absolute;
            inset: 0;
            background: url('foam/foam-logo.png') center / 220px repeat;
            opacity: 0.06;
            pointer-events: none;
        }

        /* ── Title ── */
        .zoom-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }
        .zoom-title h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4rem, 12vw, 10rem);
            letter-spacing: 0.12em;
            color: #fff;
            line-height: 0.9;
            text-shadow: 0 0 60px rgba(255,255,255,0.15);
        }
        .zoom-title p {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(0.7rem, 1.2vw, 0.95rem);
            letter-spacing: 4px;
            color: rgba(255,255,255,0.45);
            margin-top: 14px;
            text-transform: uppercase;
        }

        /* ── Cards ── */
        .zoom-card {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            will-change: transform, opacity;
            cursor: grab;
            z-index: 10;
        }
        .zoom-card:active { cursor: grabbing; }
        .zoom-card img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* ── Tags ── */
        .zoom-info {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 15;
        }
        .zoom-tag {
            padding: 8px 22px;
            border: 1px solid rgba(255,255,255,0.25);
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-family: 'Outfit', sans-serif;
            color: rgba(255,255,255,0.7);
            white-space: nowrap;
        }

        /* ── Scroll Hint ── */
        .scroll-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 5px;
            color: rgba(255,255,255,0.2);
            z-index: 15;
            text-transform: uppercase;
        }

        /* ── Lightbox ── */
        .lightbox {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.97); z-index: 9999;
            display: flex; align-items: center; justify-content: center; padding: 60px;
            opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s;
        }
        .lightbox.active { opacity: 1; visibility: visible; }
        .lightbox img { max-width: 90vw; max-height: 85vh; width: auto; height: auto; object-fit: contain; }
        .lightbox-close {
            position: absolute; top: 30px; right: 40px;
            color: #fff; font-size: 14px; letter-spacing: 3px; cursor: pointer; opacity: 0.7;
        }
        .lightbox-close:hover { opacity: 1; }

        /* ── Back Button ── */
        .back-btn {
            position: fixed; bottom: 40px; left: 40px;
            padding: 15px 30px; background: #fff; color: #000;
            text-decoration: none; font-size: 13px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            transition: all 0.3s ease; z-index: 1000;
        }
        .back-btn:hover {
            background: #000; color: #fff; border: 1px solid #fff;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .nav { padding: 12px 15px; }
            .nav-logo-box img { width: 40px; }
            .nav-links { gap: 24px; }
            .nav-links a { font-size: 11px; }
            .zoom-title h1 { font-size: clamp(2.8rem, 14vw, 5rem); }
            .zoom-title p { font-size: 0.65rem; letter-spacing: 2px; }
            .zoom-info { bottom: 50px; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 0 15px; }
            .zoom-tag { font-size: 9px; padding: 6px 14px; }
            .scroll-hint { font-size: 9px; bottom: 18px; }
            .back-btn { bottom: 20px; left: 20px; padding: 12px 24px; font-size: 11px; }
            .lightbox { padding: 40px 15px 60px; }
            .lightbox-close { top: 15px; right: 15px; padding: 12px; }
            .lightbox img { max-height: 70vh; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-box"><img src="perfil.svg" alt="David González"></div>
        </a>
        <div class="nav-links">
            <button id="musicToggle" class="music-toggle" onclick="toggleBgMusic()" title="Reproducir música" aria-label="Reproducir/pausar música">&#9654;</button>
            <a href="work.html">Work</a>
            <a href="visual-art.html">Visual Art</a>
            <a href="merch.html">Merch</a>
            <a href="about.html">About</a>
        </div>
    </nav>

    <div class="zoom-tunnel" id="zoomTunnel">
        <div class="zoom-viewport">
            <div class="zoom-title" id="zoomTitle">
                <h1>FOAM GUM</h1>
                <p>Evento · David González</p>
            </div>

            <div class="zoom-card" data-depth="3000" data-x="-35" data-y="-25" data-rot="-8" style="width:clamp(180px,22vw,320px)">
                <img src="grafica1.png" alt="Foam Gum — Gráfica 1" data-lightbox loading="lazy" decoding="async">
            </div>
            <div class="zoom-card" data-depth="4000" data-x="30" data-y="20" data-rot="6" style="width:clamp(160px,18vw,280px)">
                <img src="foam/grafica-4.png" alt="Foam Gum — Gráfica 4" data-lightbox loading="lazy" decoding="async">
            </div>
            <div class="zoom-card" data-depth="5500" data-x="-42" data-y="15" data-rot="10" style="width:clamp(200px,25vw,380px)">
                <img src="foam/grafica-3.png" alt="Foam Gum — Gráfica 3" data-lightbox loading="lazy" decoding="async">
            </div>
            <div class="zoom-card" data-depth="7000" data-x="38" data-y="-10" data-rot="-7" style="width:clamp(180px,20vw,320px)">
                <img src="foam/grafica-2.png" alt="Foam Gum — Gráfica 2" data-lightbox loading="lazy" decoding="async">
            </div>
            <div class="zoom-card" data-depth="8500" data-x="-10" data-y="30" data-rot="5" style="width:clamp(170px,20vw,300px)">
                <img src="foam/coche.png" alt="Foam Gum — Coche" data-lightbox loading="lazy" decoding="async">
            </div>

            <div class="zoom-info" id="zoomInfo">
                <span class="zoom-tag">Diseño Gráfico</span>
                <span class="zoom-tag">Cartelería</span>
            </div>
            <span class="scroll-hint" id="scrollHint">scroll ↓</span>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">✕ Cerrar</span>
        <img src="" alt="Gráfica ampliada" id="lightboxImg">
    </div>

    <a href="work.html" class="back-btn">← Volver</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
    <script>
    (function() {
        gsap.registerPlugin(ScrollTrigger);

        var tunnel = document.getElementById('zoomTunnel');
        var cards  = document.querySelectorAll('.zoom-card');
        var title  = document.getElementById('zoomTitle');
        var info   = document.getElementById('zoomInfo');
        var hint   = document.getElementById('scrollHint');

        cards.forEach(function(card) {
            var depth = parseFloat(card.dataset.depth);
            var dx    = parseFloat(card.dataset.x);
            var dy    = parseFloat(card.dataset.y);
            var rot   = parseFloat(card.dataset.rot);

            var spreadStart = 0.28 + (depth / 11000) * 0.22;

            gsap.set(card, {
                xPercent: -50,
                yPercent: -50,
                x: 0,
                y: 0,
                scale: 0.15,
                rotation: rot,
                opacity: 0
            });

            var tl = gsap.timeline({
                scrollTrigger: {
                    trigger: tunnel,
                    start: 'top top',
                    end: 'bottom bottom',
                    scrub: 1
                }
            });

            tl.fromTo(card, {
                scale: 0.15,
                x: 0,
                y: 0,
                opacity: 0
            }, {
                scale: 1,
                x: dx * 5,
                y: dy * 5,
                opacity: 1,
                rotation: rot * 0.3,
                duration: 0.12,
                ease: 'power2.out'
            }, spreadStart);
        });

        gsap.to(title, {
            scale: 6,
            opacity: 0,
            ease: 'power2.in',
            scrollTrigger: {
                trigger: tunnel,
                start: 'top top',
                end: '25% top',
                scrub: 1
            }
        });

        gsap.to(info, {
            opacity: 0,
            y: 30,
            ease: 'power1.in',
            scrollTrigger: {
                trigger: tunnel,
                start: 'top top',
                end: '10% top',
                scrub: 1
            }
        });

        gsap.to(hint, {
            opacity: 0,
            ease: 'none',
            scrollTrigger: {
                trigger: tunnel,
                start: 'top top',
                end: '5% top',
                scrub: 1
            }
        });

        /* ── Drag ── */
        Draggable.create(cards, {
            type: 'x,y',
            edgeResistance: 0.65,
            inertia: true,
            cursor: 'grab',
            activeCursor: 'grabbing',
            zIndexBoost: true
        });

        /* ── Lightbox ── */
        var lb     = document.getElementById('lightbox');
        var lbImg  = document.getElementById('lightboxImg');
        var lbClose = document.getElementById('lightboxClose');

        function openLightbox(src) {
            lbImg.src = src;
            lb.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            lb.classList.remove('active');
            document.body.style.overflow = '';
        }

        cards.forEach(function(card) {
            card.addEventListener('click', function() {
                var img = card.querySelector('img[data-lightbox]');
                if (img) openLightbox(img.src);
            });
        });

        if (lbClose) lbClose.addEventListener('click', closeLightbox);
        if (lb) lb.addEventListener('click', function(e) { if (e.target === lb) closeLightbox(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });
    })();
    </script>
    <script src="persistent-music.js"></script>
</body>
</html>
