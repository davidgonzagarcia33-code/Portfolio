    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        a, button { -webkit-tap-highlight-color: transparent; }
        body {
            background: #000;
            font-family: 'Archivo', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page-header {
            padding: 180px 60px 60px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 30px;
        }
        .page-header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 5rem;
            font-weight: 400;
            letter-spacing: 10px;
            text-transform: uppercase;
            line-height: 0.9;
        }
        .page-header-note {
            max-width: 340px;
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255,255,255,0.5);
            padding-bottom: 8px;
        }
        .page-header-note em {
            font-family: 'Instrument Serif', Georgia, serif;
            font-style: italic;
            font-size: 1.15em;
            color: rgba(255,255,255,0.8);
        }

        .art-section {
            padding: 50px 60px 40px;
        }

        /* Masonry para respetar formato original */
        .art-grid {
            columns: 3;
            column-gap: 16px;
            padding-bottom: 40px;
        }
        .art-item {
            position: relative;
            break-inside: avoid;
            margin: 0 0 16px;
            cursor: zoom-in;
            overflow: hidden;
            background: #111;
        }
        .art-item.is-video { cursor: default; }
        .art-item img,
        .art-item video {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
        }
        .art-item:hover img,
        .art-item:hover video { transform: scale(1.02); }
        .art-item figcaption {
            position: absolute;
            left: 14px;
            bottom: 12px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #fff;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .art-item:hover figcaption {
            opacity: 1;
            transform: none;
        }
        html.touch .art-item figcaption { display: none; }

        @media (max-width: 768px) {
            .page-header {
                padding: 120px 20px 36px;
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .page-header h1 { font-size: 2.4rem; letter-spacing: 4px; }
            .page-header-note { font-size: 13px; padding-bottom: 0; }
            .art-section { padding: 28px 20px 10px; }
            .art-grid { columns: 2; column-gap: 10px; }
            .art-item { margin-bottom: 10px; }
        }
    </style>

    <script>
        (function() {
            var pieces = [
                ['morbo.png', 'Morbo'],
                ['poster-yunmorbo-bn.jpg', 'Yun Morbo — cartel'],
                ['my-homies-did-everything.jpg', 'My Homies Did Everything'],
                ['poster-my-homies.jpg', 'My Homies — cartel'],
                ['my-homies-poster.png', 'My Homies — póster'],
                ['resiliencia.jpg', 'Resiliencia'],
                { video: 'duende-video.mp4', title: 'Duende' },
                ['valle-du-soleil.jpg', 'Valle du Soleil'],
                ['poster-morillas.png', 'Morillas — cartel'],
                ['grafica-2.jpg', 'Gráfica 02'],
                ['grafica-4-1.jpg', 'Gráfica 04'],
                ['img-9241.jpg', 'Sin título'],
                ['true-love.jpg', 'True Love'],
                { video: 'nofear-video.mp4', title: 'No Fear' },
                ['only-you.jpg', 'Only You'],
                ['from-me-to-you.png', 'From Me to You'],
                ['metro-soul.jpg', 'Metro Soul'],
                ['loveless.png', 'Loveless'],
                ['exodus.png', 'Exodus'],
                ['juntos-para-siempre.png', 'Juntos para siempre'],
                ['fini.png', 'Fini'],
                ['no-future.png', 'No Future']
            ];

            var grid = document.getElementById('artGrid');
            pieces.forEach(function(entry) {
                var isVideo = !Array.isArray(entry);
                var src = isVideo ? entry.video : entry[0];
                var title = isVideo ? entry.title : entry[1];
                var item = document.createElement('figure');
                item.className = 'art-item' + (isVideo ? ' is-video' : '');

                if (isVideo) {
                    var vid = document.createElement('video');
                    vid.src = src;
                    vid.muted = true;
                    vid.loop = true;
                    vid.playsInline = true;
                    vid.preload = 'metadata';
                    vid.setAttribute('aria-label', title);
                    new IntersectionObserver(function(entries) {
                        entries.forEach(function(e) {
                            if (e.isIntersecting) vid.play().catch(function(){});
                            else vid.pause();
                        });
                    }, { threshold: 0.3 }).observe(vid);
                    item.appendChild(vid);
                } else {
                    var img = document.createElement('img');
                    img.src = src;
                    img.alt = title;
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.onerror = function() { item.remove(); };
                    item.appendChild(img);
                    item.setAttribute('data-lightbox', '');
                    item.setAttribute('data-caption', title);
                }

                var cap = document.createElement('figcaption');
                cap.textContent = title;
                item.appendChild(cap);
                grid.appendChild(item);
            });
        })();
    </script>
