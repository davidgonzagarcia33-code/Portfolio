    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        a, button { -webkit-tap-highlight-color: transparent; }
        html, body {
            background: #000;
            font-family: 'Archivo', sans-serif;
            color: #fff;
            min-height: 100%;
            overflow-x: hidden;
        }

        .merch-stage {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 110px 0 70px;
            position: relative;
            overflow: hidden;
        }
        .merch-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        .merch-viewport {
            width: 100%;
            max-width: 100vw;
            height: min(84vh, 940px);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            cursor: grab;
        }
        .merch-viewport.dragging { cursor: grabbing; }
        .merch-track {
            display: flex;
            align-items: center;
            height: 100%;
            will-change: transform;
            transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .merch-slide {
            flex: 0 0 100vw;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 2vw;
        }
        .merch-item {
            position: relative;
            width: min(92vw, 84vh, 940px);
            height: min(92vw, 84vh, 940px);
            overflow: visible;
            cursor: zoom-in;
            background: transparent;
        }
        .merch-item img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            transition: opacity 0.35s ease, transform 0.45s ease;
        }
        .merch-item .merch-front { opacity: 1; z-index: 1; }
        .merch-item .merch-back { opacity: 0; z-index: 2; }
        .merch-item:hover .merch-front { opacity: 0; transform: scale(1.02); }
        .merch-item:hover .merch-back { opacity: 1; transform: scale(1.02); }

        /* Nombre de la pieza + contador */
        .merch-caption {
            display: flex;
            align-items: baseline;
            gap: 18px;
            margin-top: 18px;
            min-height: 2.4rem;
        }
        .merch-caption-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.6rem, 3.4vw, 2.4rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1;
            transition: opacity 0.3s ease;
        }
        .merch-caption-count {
            font-family: 'Instrument Serif', Georgia, serif;
            font-style: italic;
            font-size: 1.15rem;
            color: rgba(255,255,255,0.45);
        }

        .merch-hint {
            margin-top: 14px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
        }
        .merch-hint-touch { display: none; }
        html.touch .merch-hint-desktop { display: none; }
        html.touch .merch-hint-touch { display: inline; }

        .merch-dots {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }
        .merch-dot {
            width: 28px; height: 2px;
            border-radius: 0;
            background: rgba(255,255,255,0.22);
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.25s ease;
        }
        .merch-dot.active { background: #fff; }

        @media (max-width: 768px) {
            .merch-stage { padding: 100px 0 40px; }
            .merch-viewport { height: min(74vh, 680px); }
            .merch-item {
                width: min(94vw, 74vh, 560px);
                height: min(94vw, 74vh, 560px);
            }
            .merch-caption { margin-top: 10px; gap: 12px; }
        }
    </style>

    <script>
        (function() {
            var products = [
                { front: 'merch/clean-nofear-front.png', back: 'merch/clean-nofear-back.png', name: 'No Fear' },
                { front: 'merch/clean-truelove-front.png', back: 'merch/clean-truelove-back.png', name: 'True Love' },
                { front: 'merch/clean-fmty-front.png', back: 'merch/clean-fmty-back.png', name: 'From Me to You' }
            ];

            var track = document.getElementById('merchTrack');
            var dotsWrap = document.getElementById('merchDots');
            var viewport = document.getElementById('merchViewport');
            var nameEl = document.getElementById('merchName');
            var countEl = document.getElementById('merchCount');
            var index = 0;
            var autoTimer = null;
            var isDragging = false;
            var startX = 0;
            var justDragged = false;

            products.forEach(function(p, i) {
                var slide = document.createElement('div');
                slide.className = 'merch-slide';

                var item = document.createElement('div');
                item.className = 'merch-item';
                item.dataset.front = p.front;
                item.dataset.back = p.back;
                item.dataset.name = p.name;

                var front = document.createElement('img');
                front.className = 'merch-front';
                front.src = p.front;
                front.alt = 'Camiseta ' + p.name + ' — delante';
                front.draggable = false;

                var back = document.createElement('img');
                back.className = 'merch-back';
                back.src = p.back;
                back.alt = 'Camiseta ' + p.name + ' — espalda';
                back.draggable = false;

                item.appendChild(front);
                item.appendChild(back);
                slide.appendChild(item);
                track.appendChild(slide);

                var dot = document.createElement('button');
                dot.className = 'merch-dot' + (i === 0 ? ' active' : '');
                dot.type = 'button';
                dot.setAttribute('aria-label', 'Ver camiseta ' + p.name);
                dot.addEventListener('click', function() {
                    goTo(i);
                    restartAuto();
                });
                dotsWrap.appendChild(dot);
            });

            function goTo(i) {
                index = (i + products.length) % products.length;
                track.style.transform = 'translateX(' + (-index * 100) + 'vw)';
                Array.prototype.forEach.call(dotsWrap.children, function(dot, di) {
                    dot.classList.toggle('active', di === index);
                });
                nameEl.textContent = products[index].name;
                countEl.textContent = (index + 1) + ' / ' + products.length;
            }

            function next() { goTo(index + 1); }
            function prev() { goTo(index - 1); }

            function restartAuto() {
                clearInterval(autoTimer);
                autoTimer = setInterval(next, 3200);
            }

            // Entra desde la derecha en el primer pintado
            track.style.transition = 'none';
            track.style.transform = 'translateX(100vw)';
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    track.style.transition = 'transform 0.85s cubic-bezier(0.22, 1, 0.36, 1)';
                    goTo(0);
                    restartAuto();
                });
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowRight') { next(); restartAuto(); }
                if (e.key === 'ArrowLeft') { prev(); restartAuto(); }
            });

            function onDown(clientX) {
                isDragging = true;
                justDragged = false;
                startX = clientX;
                clearInterval(autoTimer);
                viewport.classList.add('dragging');
            }
            function onMove(clientX) {
                if (!isDragging) return;
                if (Math.abs(clientX - startX) > 8) justDragged = true;
            }
            function onUp(clientX) {
                if (!isDragging) return;
                isDragging = false;
                viewport.classList.remove('dragging');
                var dx = clientX - startX;
                if (dx < -50) next();
                else if (dx > 50) prev();
                restartAuto();
            }

            viewport.addEventListener('mousedown', function(e) { onDown(e.clientX); });
            window.addEventListener('mousemove', function(e) { onMove(e.clientX); });
            window.addEventListener('mouseup', function(e) { onUp(e.clientX); });
            viewport.addEventListener('touchstart', function(e) { onDown(e.touches[0].clientX); }, { passive: true });
            viewport.addEventListener('touchmove', function(e) { onMove(e.touches[0].clientX); }, { passive: true });
            viewport.addEventListener('touchend', function(e) { onUp(e.changedTouches[0].clientX); });

            // Ampliar: delante o espalda según lo que se esté viendo
            track.addEventListener('click', function(e) {
                if (justDragged) return;
                var item = e.target.closest('.merch-item');
                if (!item) return;
                var showingBack = item.matches(':hover') && !document.documentElement.classList.contains('touch');
                var src = showingBack ? item.dataset.back : item.dataset.front;
                if (src) window.DG.lightbox.open(src, 'Camiseta ' + item.dataset.name + (showingBack ? ' — espalda' : ' — delante'));
            });
            document.addEventListener('dg:lightbox-open', function() { clearInterval(autoTimer); });
            document.addEventListener('dg:lightbox-close', restartAuto);
        })();
    </script>
